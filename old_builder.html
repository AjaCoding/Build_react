<html lang="en"><head>
    <meta charset="UTF-8">
    <title>Build it</title>

    <link href="builder.css" rel="stylesheet" type="text/css">
    <script src="builder.js" type="text/javascript"></script>
    <script src="script.js" defer></script>

</head>

<body>
    <h1> Hello, let's build. </h1>
    <div id="root">
        <div id="mainBuilderContent">
            <p> Welcome to this web Builder! Please use this tool to create a webpage layout. </p>
            <div id="formContainer">
                <form action="builder.html" method="post" id="mainForm"> 
                    <table class="formTable">
                        <label for="p">Enter p content: </label>
                        <input type="text" id="p"></input>

                        
                        <br />
                        <label for="allItems">Enter items: </label>
                        <select name="tag" id="all">
                            <option value="p">Add Paragraph </option>
                            <option value="h1">Add Header  </option>
                            <option value="img">Add Image </option>
                            <option value="a">Add Link </option>
                            <option value="button">Add Button </option>
                            <option value="input">Add Input </option>
                        </select>
                        <label for="content">Enter content: </label>
                        <input type="text" id="content" name="content"></input>
                        <input type="text" id="class" name="class" placeholder="Enter class name"></input>
                        <br />
                        <input type="button" id="addItem" value="Add Item"></input>
                        <button onlick="addItemInputRow()">Add Item Input Row</button>
                        <input type="submit" value="submit">
                    </table>
                </form>
            </div> <!-- formContainer -->
        </div> <!-- mainBuilderContent --> 
        <div id="rootContainer" style="background-color: lightblue;">

        </div>
    </div>

</body>
</html>
